<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>云南高考家长群 · 免费加入</title>
<meta name="description" content="免费加入云南16个地州家长交流群，获取高考政策解读、志愿填报指导、录取数据分析。">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; min-height:100vh; background: linear-gradient(160deg, #0f1b3d, #1e40af, #1e3a8a); }
.qr-img { width:160px; height:160px; object-fit:cover; border-radius:12px; border:2px solid rgba(255,255,255,0.15); }
</style>
</head>
<body class="flex items-center justify-center p-5 min-h-screen">

<div class="w-full max-w-sm text-center">
  <!-- 图标 -->
  <div class="w-16 h-16 rounded-2xl bg-white/15 flex items-center justify-center mx-auto mb-4 border border-white/20 shadow-lg shadow-black/10">
    <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
  </div>

  <!-- 标题 -->
  <h1 class="text-2xl font-black text-white mb-2">云南高考家长群</h1>
  <p class="text-sm text-blue-200 mb-6">覆盖全省16个地州 · 免费加入</p>

  <!-- 两个二维码 -->
  <div class="flex justify-center gap-4 mb-6">
    <div>
      <div class="qr-img mx-auto overflow-hidden shadow-lg">
        <img id="qrcode-main" src="二维码.jpg" alt="微信二维码" class="w-full h-full object-cover">
      </div>
      <p class="text-xs text-blue-300 mt-2">微信①</p>
    </div>
    <div>
      <div class="qr-img mx-auto overflow-hidden shadow-lg">
        <img id="qrcode-main2" src="二维码.jpg" alt="微信二维码2" class="w-full h-full object-cover">
      </div>
      <p class="text-xs text-blue-300 mt-2">微信②</p>
    </div>
  </div>

  <p class="text-sm text-blue-100 mb-1">长按识别二维码加群</p>
  <p class="text-xs text-blue-300/50 mb-6">备注"地州+家长" 免费进群</p>

  <!-- 权益 -->
  <div class="bg-white/10 backdrop-blur rounded-2xl p-4 border border-white/10 mb-6">
    <div class="grid grid-cols-2 gap-2 text-sm">
      <div class="text-blue-100"><i class="fas fa-newspaper text-yellow-400 mr-1.5"></i>政策解读</div>
      <div class="text-blue-100"><i class="fas fa-chart-bar text-yellow-400 mr-1.5"></i>数据分析</div>
      <div class="text-blue-100"><i class="fas fa-user-tie text-yellow-400 mr-1.5"></i>专家答疑</div>
      <div class="text-blue-100"><i class="fas fa-download text-yellow-400 mr-1.5"></i>免费手册</div>
    </div>
  </div>

  <!-- 提示 -->
  <p class="text-xs text-blue-300/40">看到的家长帮忙转发给身边的云南高考家长 🙏</p>
</div>

<script src="cloud-config.js"></script>
<script src="owner-config.js"></script>
<script>
// 从后台加载已配置的二维码
(async function() {
  try {
    var data = await CloudStorage.readCityQRData();
    if (!data) return;
    if (data.main1) {
      var m1 = document.getElementById('qrcode-main');
      if (m1) m1.src = data.main1;
    }
    if (data.main2) {
      var m2 = document.getElementById('qrcode-main2');
      if (m2) m2.src = data.main2;
    }
  } catch(e) {}
})();
</script>
</body>
</html>
