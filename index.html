// ===== SURNAMES for live feed =====
const SURNAMES = ['李','王','张','刘','陈','杨','赵','黄','周','吴','徐','孙','马','胡','朱','郭','何','罗','高','林'];
const CITY_NAMES = CITIES.filter(c=>c.id!=='ynOthers').map(c=>c.name);
const FEED_ACTIONS = ['刚刚加入{name}家长群','扫码进群 · {name}','{name}家长已加入'];
function rand(a){return a[Math.floor(Math.random()*a.length)]}

// ===== 渲染权益横滑 =====
function renderBenefits() {
  const row = document.getElementById('benefitRow');
  if (!row) return;
  row.innerHTML = BENEFITS.map(b => `
    <div onclick="showBenefit('${b.id}')" class="benefit-item shrink-0 w-[100px] bg-white rounded-xl border border-gray-100 p-3 text-center shadow-sm">
      <div class="w-10 h-10 rounded-xl ${b.color} flex items-center justify-center mx-auto mb-2">
        <i class="fas ${b.icon} ${b.iconColor} text-base"></i>
      </div>
      <div class="text-xs font-medium text-gray-800">${b.label}</div>
    </div>
  `).join('');
}

// ===== 弹窗显示详情 =====
let currentBenefit = null;
function showBenefit(id) {
  const b = BENEFITS.find(x => x.id === id);
  if (!b) return;
  currentBenefit = b;
  document.getElementById('modalContent').innerHTML = `
    <h3 class="text-lg font-bold text-gray-900 mb-3">${b.title}</h3>
    ${b.content}
    <a href="#join" class="block w-full mt-4 py-3 bg-brand-700 text-white text-center rounded-xl font-bold text-sm" onclick="closeModal()">
      <i class="fab fa-weixin mr-1.5"></i>免费加入 · 获取全部权益
    </a>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalSheet').classList.add('show');
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('show');
  document.getElementById('modalSheet').classList.remove('show');
}

// ===== 渲染实时动态 =====
function renderLiveFeed() {
  const feed = document.getElementById('liveFeed');
  if (!feed) return;
  const items = [];
  for (let i=0; i<20; i++) {
    const s = rand(SURNAMES), c = rand(CITY_NAMES), a = rand(FEED_ACTIONS).replace('{name}',c);
    const t = Math.floor(Math.random()*30+1);
    items.push(`<div class="flex items-center gap-2.5 text-xs py-1.5 border-b border-gray-50 last:border-0">
      <div class="w-6 h-6 rounded-full bg-brand-50 flex items-center justify-center text-[10px] font-bold text-brand-700 shrink-0">${s}</div>
      <span class="text-gray-600"><span class="font-medium text-gray-800">${s}家长</span> ${a}</span>
      <span class="text-gray-300 ml-auto shrink-0">${t}分钟前</span>
    </div>`);
  }
  feed.innerHTML = items.join('') + items.join('');
}

// ===== 渲染城市网格 =====
function renderCities() {
  const grid = document.getElementById('cityGrid');
  if (!grid) return;
  grid.innerHTML = CITIES.map(c => `
    <div onclick="showCity('${c.id}')" class="city-card bg-white rounded-xl p-2.5 text-center">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center mx-auto mb-1.5" style="background:${c.color}">
        <i class="fas ${c.icon} text-white text-xs"></i>
      </div>
      <div class="text-xs font-semibold text-gray-900">${c.name}</div>
      <div class="text-[10px] text-gray-400 mt-0.5">${c.students}</div>
    </div>
  `).join('');
}

// ===== 城市详情 =====
function showCity(id) {
  const city = CITIES.find(c => c.id === id);
  if (!city) return;
  const d = CITY_DETAILS[id];
  if (!d) return;
  const sec = document.getElementById('cityDetail');
  const content = document.getElementById('cityDetailContent');
  if (!sec || !content) return;

  content.innerHTML = `
    <div class="bg-white rounded-2xl border border-gray-100 p-5 shadow-sm">
      <div class="flex items-center gap-3 mb-4">
        <div class="w-10 h-10 rounded-xl flex items-center justify-center" style="background:${city.color}">
          <i class="fas ${city.icon} text-white"></i>
        </div>
        <div>
          <h3 class="font-bold text-gray-900">${city.name}家长群</h3>
          <p class="text-xs text-gray-400">${city.badge} · ${city.students}考生</p>
        </div>
      </div>
      <div class="bg-brand-50 rounded-lg p-3 mb-4 text-sm text-brand-800 flex items-center gap-2">
        <i class="fab fa-weixin"></i> 已有 ${Math.floor(Math.random()*200+50)} 位家长在群内
      </div>
      <p class="text-xs text-gray-500 mb-4">${d.desc}</p>
      <div class="flex flex-wrap gap-1.5 mb-4">
        ${d.schools.split('、').map(s => `<span class="px-2 py-0.5 bg-gray-50 text-gray-500 text-[10px] rounded border border-gray-100">${s}</span>`).join('')}
      </div>
      <div class="space-y-1.5 mb-5">
        ${d.tips.map(t => `<div class="flex items-start gap-2 text-xs p-2.5 bg-brand-50 rounded-lg"><i class="fas fa-lightbulb text-brand-700 text-[10px] mt-0.5"></i><span class="text-gray-600">${t}</span></div>`).join('')}
      </div>
      <a href="#join" class="block w-full py-3 bg-brand-700 text-white text-center rounded-xl font-bold text-sm">
        <i class="fab fa-weixin mr-1.5"></i>加入${city.name}家长群
      </a>
    </div>
  `;

  document.getElementById('cities').classList.add('hidden');
  sec.classList.remove('hidden');
  sec.scrollIntoView({ behavior:'smooth' });
}

function closeCityDetail() {
  document.getElementById('cityDetail').classList.add('hidden');
  document.getElementById('cities').classList.remove('hidden');
}

// ===== 渲染FAQ =====
function renderFAQ() {
  const list = document.getElementById('faqList');
  if (!list) return;
  const faqs = [
    { q:'加入家长群收费吗？', a:'完全免费。群内定期分享政策解读和填报技巧，没有任何隐形收费。' },

// ===== URL param =====
function checkUrlParam() {
  const p = new URLSearchParams(window.location.search);
  const city = p.get('city');
  if (city) setTimeout(() => showCity(city), 100);
}

// ===== INIT =====
document.addEventListener('DOMContentLoaded', () => {
  renderBenefits();
  renderLiveFeed();
  renderCities();
  renderReviews();
  renderFAQ();
  checkUrlParam();
});
</script>
