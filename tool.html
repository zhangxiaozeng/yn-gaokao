function setSubject(val) {
  subject = val;
  const likeBtn = document.getElementById('btnLiKe');
  const wenkeBtn = document.getElementById('btnWenKe');
  if (val === 'like') {
    likeBtn.className = 'flex-1 py-3 px-4 rounded-xl border-2 font-bold text-sm transition-all bg-primary text-white border-primary';
    wenkeBtn.className = 'flex-1 py-3 px-4 rounded-xl border-2 font-bold text-sm transition-all bg-white text-gray-600 border-gray-200';
    document.getElementById('yibenLine').textContent = LINES.like.yiben;
  } else {
    likeBtn.className = 'flex-1 py-3 px-4 rounded-xl border-2 font-bold text-sm transition-all bg-white text-gray-600 border-gray-200';
    wenkeBtn.className = 'flex-1 py-3 px-4 rounded-xl border-2 font-bold text-sm transition-all bg-primary text-white border-primary';
    document.getElementById('yibenLine').textContent = LINES.wenke.yiben;
  }
}

function syncScore(val) {
  document.getElementById('scoreInput').value = val;
  document.getElementById('scoreSlider').value = val;
}

function quickScore(val) {
  syncScore(val);
  search();
}

// ===== 核心查询逻辑 =====
function search() {
  const score = parseInt(document.getElementById('scoreInput').value);
  if (!score || score < 0 || score > 750) {
    alert('请输入有效分数（0-750分）');
    return;
  }

  // 显示加载
  document.getElementById('loading').classList.remove('hidden');
  document.getElementById('resultSummary').classList.add('hidden');
  document.getElementById('resultArea').classList.add('hidden');

  setTimeout(() => {
    const lines = LINES[subject];
    const scoreField = subject; // 'like' or 'wenke'

    // 匹配学校
    const matched = [];
    SCHOOLS.forEach(s => {
      const range = s[scoreField];
      if (!range) return;
      const [min, max] = range;
      // 分数在录取范围内
      if (score >= min - 15 && score <= max + 5) {
        let level = 'baodi';
        const diff = score - (min + max) / 2;
        if (diff > 8) level = 'wentuo';
        if (diff < -8) level = 'chongci';
        // 离录取线差15分以上也算保底
        if (score >= max + 3) level = 'baodi';

        matched.push({
          name: s.name,
          city: s.city,
          type: s.type,
          tag: s.tag,
          level: level,
          minScore: min,
          maxScore: max,
          avgScore: Math.round((min + max) / 2),
          diff: score - Math.round((min + max) / 2)
        });
      }
    });

    // 排序：冲刺→稳妥→保底，按分数差排序
    const order = { chongci: 0, wentuo: 1, baodi: 2 };
    matched.sort((a, b) => {
      if (order[a.level] !== order[b.level]) return order[a.level] - order[b.level];
      return Math.abs(a.diff) - Math.abs(b.diff);
    });

    // 渲染
    renderResults(score, matched);

    document.getElementById('loading').classList.add('hidden');
  }, 400);
}

function renderResults(score, matched) {
  const chongci = matched.filter(m => m.level === 'chongci');
  const wentuo = matched.filter(m => m.level === 'wentuo');
  const baodi = matched.filter(m => m.level === 'baodi');

  // 摘要
  document.getElementById('displayScore').textContent = score;
  const subjName = subject === 'like' ? '理科' : '文科';
  const subjEl = document.getElementById('displaySubject');
  subjEl.textContent = subjName;
  subjEl.className = 'ml-3 px-3 py-1 rounded-full text-sm font-medium ' +
    (subject === 'like'
      ? 'bg-blue-100 text-blue-700'
      : 'bg-rose-100 text-rose-700');

  document.getElementById('countChongci').textContent = chongci.length;
  document.getElementById('countWentuo').textContent = wentuo.length;
  document.getElementById('countBaodi').textContent = baodi.length;

  document.getElementById('resultSummary').classList.remove('hidden');

  // 详情
  const area = document.getElementById('resultArea');
  let html = '';

  if (chongci.length > 0) {
    html += renderLevel(chongci, 'chongci', '🚀 冲刺院校', '分数略低于往年录取线，可以冲一冲', 'border-rose-200 bg-rose-50');
  }
  if (wentuo.length > 0) {
    html += renderLevel(wentuo, 'wentuo', '✅ 稳妥院校', '分数匹配度高，录取概率较大', 'border-emerald-200 bg-emerald-50');
  }
  if (baodi.length > 0) {
    html += renderLevel(baodi, 'baodi', '🛡️ 保底院校', '分数高于往年录取线，基本稳上', 'border-blue-200 bg-blue-50');
  }

  if (matched.length === 0) {
    html = `
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-12 text-center">
        <i class="fas fa-search text-5xl text-gray-300 mb-4"></i>
        <h3 class="text-xl font-bold text-gray-600 mb-2">未匹配到院校</h3>
        <p class="text-gray-400">可能分数过高或过低，试试调整分数</p>
      </div>
    `;
  }

  area.innerHTML = html;
  area.classList.remove('hidden');
}

function renderLevel(schools, level, title, desc, borderStyle) {
  const colors = {
    chongci: { bg: 'bg-rose-100', text: 'text-rose-600', label: '冲刺' },
    wentuo: { bg: 'bg-emerald-100', text: 'text-emerald-600', label: '稳妥' },
    baodi: { bg: 'bg-blue-100', text: 'text-blue-600', label: '保底' }
  };
  const c = colors[level];

  return `
    <div class="mb-6 fade-in">
      <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
        <div class="p-5 border-b border-gray-50">
          <h3 class="text-lg font-bold">${title}</h3>
          <p class="text-sm text-gray-500 mt-1">${desc}</p>
        </div>
        <div class="divide-y divide-gray-50">
          ${schools.map(s => `
            <div class="result-card p-4 flex items-center justify-between hover:bg-gray-50/50">
              <div class="flex-1 min-w-0">
                <div class="flex items-center gap-2">
                  <span class="font-semibold text-gray-900 truncate">${s.name}</span>
                  <span class="shrink-0 px-2 py-0.5 text-xs rounded-full ${c.bg} ${c.text} font-medium">${c.label}</span>
                </div>
                <div class="flex items-center gap-3 mt-1 text-xs text-gray-500">
                  <span><i class="fas fa-map-pin mr-1"></i>${s.city}</span>
                  <span class="px-1.5 py-0.5 bg-gray-100 rounded">${s.type}</span>
                  ${s.tag ? `<span class="px-1.5 py-0.5 bg-gray-100 rounded">${s.tag}</span>` : ''}
                </div>
              </div>
              <div class="text-right ml-4 shrink-0">
                <div class="text-sm font-bold ${c.text}">${s.avgScore}</div>
                <div class="text-xs text-gray-400">均分</div>
              </div>
            </div>
          `).join('')}
        </div>
      </div>
    </div>
  `;
}

// ===== 回车查询 =====
document.addEventListener('DOMContentLoaded', () => {
  document.getElementById('scoreInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') search();
  });
  // 默认首次查询
  search();
});
</script>
</body>
