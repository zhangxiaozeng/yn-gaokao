name: 🎯 每日小红书内容生成

on:
  schedule:
    # 每天早上 7:00 (北京时间 = UTC 23:00，但 GitHub Actions 是 UTC)
    # 用 UTC 23:00 = 北京时间 07:00
    - cron: '0 23 * * *'
  workflow_dispatch:
    # 允许手动触发
    inputs:
      mode:
        description: '生成模式'
        required: false
        default: 'template'
        type: choice
        options:
          - template
          - ai

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 检出代码
        uses: actions/checkout@v4

      - name: 🔧 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 🎯 生成内容
        run: |
          node scripts/generate-content.js
        env:
          DEEPSEEK_KEY: ${{ secrets.DEEPSEEK_KEY }}

      - name: 📤 提交到仓库
        run: |
          git config user.name "每日内容机器人"
          git config user.email "bot@yn-gaokao.gh"
          git add -A
          # 检查是否有变更
          if git diff --cached --quiet; then
            echo "没有新内容生成"
          else
            git commit -m "🤖 每日内容更新 $(date '+%Y-%m-%d')"
            git push
          fi
