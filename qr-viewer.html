<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>二维码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ===== 彻底禁用微信 bfcache =====
window.onunload = function(){};
window.onbeforeunload = function(){};
window.addEventListener('pageshow', function(ev){
  if (ev.persisted) location.reload();
});

document.addEventListener('DOMContentLoaded', function(){
  var imgUrl = new URLSearchParams(location.search).get('img');
  if (!imgUrl) return;

  var img = document.getElementById('qr-img');
  if (!img) return;

  // GitHub Pages 有 CORS 头，设置 crossOrigin 让 canvas 能读取像素
  img.setAttribute('crossOrigin', 'anonymous');
  // 缓存破环，确保每次拿到最新图片
  var sep = imgUrl.indexOf('?') > -1 ? '&' : '?';
  img.src = imgUrl + sep + '_t=' + Date.now();

  // 图片加载完成后 jsQR 解码
  img.onload = function() {
    if (typeof jsQR !== 'function') return;
    try {
      var c = document.createElement('canvas');
      c.width = img.naturalWidth;
      c.height = img.naturalHeight;
      var ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      var d = ctx.getImageData(0, 0, c.width, c.height);
      var code = jsQR(d.data, d.width, d.height);
      if (code && code.data && code.data.indexOf('http') === 0) {
        location.replace(code.data);
      }
    } catch(e) {
      // canvas CORS 失败：直接跳到图片 URL，让用户手动长安识别
      // location.href = imgUrl + sep + '_t=' + Date.now();
    }
  };
});
</script>
</head>
<body>
<img id="qr-img" src="" alt="">
</body>
</html>
