<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>二维码 - 长安识别加群</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#fff;display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%;max-height:100vh;width:auto;height:auto}
</style>
<script>
// ===== 彻底禁用微信 bfcache：每次进来都是新页面 =====
window.onunload = function(){};
window.onbeforeunload = function(){};
window.addEventListener('pageshow', function(ev){
  if (ev.persisted) location.reload();
});
// ===== 加载二维码图片 =====
document.addEventListener('DOMContentLoaded', function(){
  var p = new URLSearchParams(location.search);
  var imgUrl = p.get('img');
  if (imgUrl) document.getElementById('qr-img').src = imgUrl;
});
</script>
</head>
<body>
<img id="qr-img" src="" alt="二维码 - 长安识别加群">
</body>
</html>
