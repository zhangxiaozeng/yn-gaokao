<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>二维码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%}
</style>
<script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.min.js"></script>
<script>
// ===== 彻底禁用微信 bfcache =====
window.onunload = function(){};
window.onbeforeunload = function(){};
window.addEventListener('pageshow', function(ev){
  if (ev.persisted) location.reload();
});

document.addEventListener('DOMContentLoaded', function(){
  var imgUrl = new URLSearchParams(location.search).get('img');
  if (!imgUrl) return;
  var sep = imgUrl.indexOf('?') > -1 ? '&' : '?';
  var cbUrl = imgUrl + sep + '_t=' + Date.now();

  var img = document.getElementById('qr-img');

  // ===== 方案 A: 直接显示图片（用户可手动长安识别，作为兜底） =====
  img.src = cbUrl;

  // ===== 方案 B: fetch 下载 → createImageBitmap → canvas → jsQR 解码 → 自动跳转 =====
  // 这步绕过 img 标签的跨域限制，直接从 GitHub 下载二进制数据
  if (typeof jsQR !== 'function') return;
  fetch(cbUrl, { mode: 'cors', cache: 'no-cache' })
    .then(function(r) { if (!r.ok) throw new Error('HTTP ' + r.status); return r.blob(); })
    .then(function(blob) { return createImageBitmap(blob); })
    .then(function(bitmap) {
      var c = document.createElement('canvas');
      c.width = bitmap.width;
      c.height = bitmap.height;
      var ctx = c.getContext('2d');
      ctx.drawImage(bitmap, 0, 0);
      var d = ctx.getImageData(0, 0, c.width, c.height);
      var code = jsQR(d.data, d.width, d.height);
      if (code && code.data && code.data.indexOf('http') === 0) {
        // 直接跳转企业微信群加群页面，不走微信内部链接处理
        location.replace(code.data);
      }
    })
    .catch(function() {
      // fetch 或解码失败 → 图片已通过方案 A 显示，用户可手动长安识别
    });
});
</script>
</head>
<body>
<img id="qr-img" src="" alt="">
</body>
</html>
