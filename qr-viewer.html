<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>二维码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%}
</style>
<script src="jsqr.min.js"></script>
<script>
// ===== 禁用 bfcache =====
window.onunload = function(){};
window.onbeforeunload = function(){};
window.addEventListener('pageshow', function(ev){
  if (ev.persisted) location.reload();
});

document.addEventListener('DOMContentLoaded', function(){
  var imgUrl = new URLSearchParams(location.search).get('img');
  if (!imgUrl) return;
  var sep = imgUrl.indexOf('?') > -1 ? '&' : '?';
  var cbUrl = imgUrl + sep + '_t=' + Date.now();
  var img = document.getElementById('qr-img');

  // 方案A：显示原图，用户可手动长安识别（兜底）
  img.src = cbUrl;

  // 方案B：本地 jsQR 解码
  // 用 XHR 下载图片 → 转 dataURL → canvas 提取像素 → jsQR 解码 → 直跳
  if (typeof jsQR !== 'function') return;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', cbUrl, true);
  xhr.responseType = 'blob';
  xhr.onload = function() {
    if (xhr.status !== 200) return;
    var fr = new FileReader();
    fr.onload = function(e) {
      var tmp = new Image();
      tmp.onload = function() {
        try {
          var c = document.createElement('canvas');
          c.width = tmp.width;
          c.height = tmp.height;
          var ctx = c.getContext('2d');
          ctx.drawImage(tmp, 0, 0);
          var px = ctx.getImageData(0, 0, c.width, c.height);
          var code = jsQR(px.data, px.width, px.height);
          if (code && code.data && code.data.indexOf('http') === 0) {
            location.replace(code.data);
          }
        } catch(e) {}
      };
      tmp.src = fr.result;
    };
    fr.readAsDataURL(xhr.response);
  };
  xhr.onerror = function(){};
  xhr.send();
});
</script>
</head>
<body>
<img id="qr-img" src="" alt="">
</body>
</html>
