<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>二维码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%;max-height:100%}
</style>
<script src="jsqr.min.js"></script>
<script>
// ===== 三重 bfcache 检测 + 全新 URL 跳转（location.reload 不管用时强制重定向） =====
(function(){
  var u = location.href;
  if (u.indexOf('bfcache=') > -1) return; // 本次就是重定向后的新页面

  var needFresh = false;
  // ① PerformanceNavigationTiming API
  try {
    var n = performance.getEntriesByType('navigation');
    if (n.length && (n[0].type === 'back_forward' || n[0].type === 'reload')) needFresh = true;
  } catch(e){}
  // ② window.name 持久化检测：bfcache 恢复后 window.name 保持原值
  if (!needFresh && window.name && window.name.indexOf('qr_') === 0) needFresh = true;
  window.name = 'qr_' + Date.now() + '_' + Math.random();

  if (needFresh) {
    var sep = u.indexOf('?') > -1 ? '&' : '?';
    location.replace(u + sep + 'bfcache=' + Date.now() + '_' + Math.random());
    return;
  }
})();

// ===== pageshow 属性 + 事件写法双重保险 =====
window.onpageshow = function(ev){
  if (ev.persisted && location.href.indexOf('bfcache=') === -1) {
    var sep = location.href.indexOf('?') > -1 ? '&' : '?';
    location.replace(location.href + sep + 'bfcache=' + Date.now() + '_' + Math.random());
  }
};
window.addEventListener('pageshow', function(ev){
  if (ev.persisted && location.href.indexOf('bfcache=') === -1) {
    var sep = location.href.indexOf('?') > -1 ? '&' : '?';
    location.replace(location.href + sep + 'bfcache=' + Date.now() + '_' + Math.random());
  }
});
window.onunload = function(){};
window.onbeforeunload = function(){};

// ===== 加载二维码 + jsQR 解码 =====
document.addEventListener('DOMContentLoaded', function(){
  var imgUrl = new URLSearchParams(location.search).get('img');
  if (!imgUrl) return;
  var sep = imgUrl.indexOf('?') > -1 ? '&' : '?';
  var cbUrl = imgUrl + sep + '_t=' + Date.now() + '_r=' + Math.random();
  var img = document.getElementById('qr-img');
  img.src = cbUrl;

  if (typeof jsQR !== 'function') return;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', cbUrl, true);
  xhr.responseType = 'blob';
  xhr.setRequestHeader('Cache-Control', 'no-cache, no-store');
  xhr.setRequestHeader('Pragma', 'no-cache');
  xhr.onload = function() {
    if (xhr.status !== 200) return;
    try {
      var fr = new FileReader();
      fr.onload = function(e) {
        var tmp = new Image();
        tmp.onload = function() {
          var c = document.createElement('canvas');
          c.width = tmp.width;
          c.height = tmp.height;
          var ctx = c.getContext('2d');
          if (!ctx) return;
          ctx.drawImage(tmp, 0, 0);
          var px = ctx.getImageData(0, 0, c.width, c.height);
          var code = jsQR(px.data, px.width, px.height);
          if (code && code.data && code.data.indexOf('http') === 0) {
            location.replace(code.data);
          }
        };
        tmp.onerror = function(){};
        tmp.src = fr.result;
      };
      fr.onerror = function(){};
      fr.readAsDataURL(xhr.response);
    } catch(e) {}
  };
  xhr.onerror = function(){};
  xhr.send();
});
</script>
</head>
<body>
<img id="qr-img" src="" alt="">
</body>
</html>
