<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>二维码</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#000;display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%}
</style>
<script src="jsqr.min.js"></script>
<script>
// ===== 禁用 bfcache（X5 属性写法 + 事件写法双重保险） =====
window.onunload = function(){};
window.onbeforeunload = function(){};
window.onpageshow = function(ev){ if (ev.persisted) location.reload(); };
window.addEventListener('pageshow', function(ev){ if (ev.persisted) location.reload(); });

document.addEventListener('DOMContentLoaded', function(){
  var imgUrl = new URLSearchParams(location.search).get('img');
  if (!imgUrl) return;
  var sep = imgUrl.indexOf('?') > -1 ? '&' : '?';
  var cbUrl = imgUrl + sep + '_t=' + Date.now() + '_r=' + Math.random();
  var img = document.getElementById('qr-img');
  var redirected = false;

  // 显示原图（兜底，用户可手动长安识别）
  img.src = cbUrl;

  // jsQR 解码：XHR 下载 → FileReader → Image → canvas → jsQR → 直跳
  if (typeof jsQR !== 'function') return;
  var xhr = new XMLHttpRequest();
  xhr.open('GET', cbUrl, true);
  xhr.responseType = 'blob';
  xhr.setRequestHeader('Cache-Control', 'no-cache, no-store');
  xhr.setRequestHeader('Pragma', 'no-cache');
  xhr.onload = function() {
    if (xhr.status !== 200 || redirected) return;
    try {
      var fr = new FileReader();
      fr.onload = function(e) {
        if (redirected) return;
        var tmp = new Image();
        tmp.onload = function() {
          if (redirected) return;
          var c = document.createElement('canvas');
          c.width = tmp.width;
          c.height = tmp.height;
          var ctx = c.getContext('2d');
          if (!ctx) return;
          ctx.drawImage(tmp, 0, 0);
          var px = ctx.getImageData(0, 0, c.width, c.height);
          var code = jsQR(px.data, px.width, px.height);
          if (code && code.data && code.data.indexOf('http') === 0) {
            redirected = true;
            location.replace(code.data);
          }
        };
        tmp.onerror = function(){};
        tmp.src = fr.result;
      };
      fr.onerror = function(){};
      fr.readAsDataURL(xhr.response);
    } catch(e) {}
  };
  xhr.onerror = function(){};
  xhr.send();
});
</script>
</head>
<body>
<img id="qr-img" src="" alt="">
</body>
</html>
