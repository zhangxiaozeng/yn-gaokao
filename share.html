<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<meta property="og:title" content="云南高考家长群">

<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif; min-height:100vh; overflow-x:hidden; }
.bg-grad { background:linear-gradient(160deg, #0f1b3d 0%, #1e40af 40%, #1e3a8a 70%, #0f1b3d 100%); }
.bg-card { background:linear-gradient(135deg, rgba(255,255,255,0.12), rgba(255,255,255,0.05)); backdrop-filter:blur(20px); border:1px solid rgba(255,255,255,0.1); }
.btn-shine { position:relative; overflow:hidden; }
.btn-shine::after { content:''; position:absolute; top:-50%; left:-60%; width:40%; height:200%; background:linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent); transform:rotate(25deg); animation:shine 3s ease-in-out infinite; }
@keyframes shine { 0%{left:-60%} 100%{left:120%} }
@keyframes fadeUp { from{opacity:0;transform:translateY(30px)} to{opacity:1;transform:translateY(0)} }
@keyframes scaleIn { from{opacity:0;transform:scale(0.8)} to{opacity:1;transform:scale(1)} }
@keyframes dotPulse { 0%,100%{opacity:1} 50%{opacity:0.3} }
.fade-1 { animation:fadeUp 0.8s ease both; }
.fade-2 { animation:fadeUp 0.8s ease 0.2s both; }
.fade-3 { animation:fadeUp 0.8s ease 0.4s both; }
.fade-4 { animation:fadeUp 0.8s ease 0.6s both; }
.scale-in { animation:scaleIn 0.6s ease 0.3s both; }
.dot { animation:dotPulse 1.5s ease-in-out infinite; }
</style>
</head>
<body>

<div class="bg-grad min-h-screen px-5 pb-10 pt-12 flex flex-col items-center relative">
  <!-- 装饰圆 -->
  <div class="absolute top-[-80px] right-[-80px] w-64 h-64 rounded-full bg-blue-500/10"></div>
  <div class="absolute bottom-[-40px] left-[-40px] w-48 h-48 rounded-full bg-yellow-500/5"></div>

  <!-- 头部 -->
  <div class="text-center mb-8 fade-1 relative z-10">
    <div class="w-16 h-16 rounded-2xl bg-white/15 flex items-center justify-center mx-auto mb-4 border border-white/20 shadow-lg shadow-black/10">
      <svg class="w-8 h-8 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l9-5-9-5-9 5 9 5z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14z"/></svg>
    </div>
    <h1 class="text-3xl font-black text-white tracking-tight">
      云南<span class="text-yellow-400">高考家长群</span>
    </h1>
    <p class="text-blue-200 text-sm mt-2">覆盖全省16个地州 · 免费加入</p>
  </div>

  <!-- 权益卡 -->
  <div class="scale-in w-full max-w-sm mb-6">
    <div class="bg-card rounded-2xl p-5 shadow-xl">
      <div class="grid grid-cols-2 gap-3">
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-blue-500/30 flex items-center justify-center shrink-0"><i class="fas fa-newspaper text-white text-xs"></i></div>
          <span class="text-xs text-blue-100">最新政策解读</span>
        </div>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-yellow-500/30 flex items-center justify-center shrink-0"><i class="fas fa-chart-bar text-white text-xs"></i></div>
          <span class="text-xs text-blue-100">录取数据分析</span>
        </div>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-green-500/30 flex items-center justify-center shrink-0"><i class="fas fa-user-tie text-white text-xs"></i></div>
          <span class="text-xs text-blue-100">专家在线答疑</span>
        </div>
        <div class="flex items-center gap-2.5">
          <div class="w-9 h-9 rounded-xl bg-purple-500/30 flex items-center justify-center shrink-0"><i class="fas fa-download text-white text-xs"></i></div>
          <span class="text-xs text-blue-100">免费填报手册</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 进群按钮 -->
  <div class="w-full max-w-sm mb-6 fade-2">
    <a href="https://zhangxiaozeng.github.io/yn-gaokao/?from=share"
       class="btn-shine block w-full py-4 bg-gradient-to-r from-yellow-500 to-yellow-400 text-gray-900 rounded-2xl font-bold text-lg shadow-lg shadow-yellow-500/30 text-center active:scale-[0.97] transition-transform">
      <i class="fab fa-weixin mr-2"></i>立即免费加入
    </a>
    <p class="text-xs text-blue-300/50 text-center mt-2">点击按钮 → 选择地州 → 扫码进群</p>
  </div>

  <!-- 动态 -->
  <div class="w-full max-w-sm mb-8 fade-3">
    <div class="bg-card rounded-2xl p-4 shadow-xl">
      <div class="flex items-center gap-2 mb-3">
        <span class="dot w-2 h-2 rounded-full bg-green-400 inline-block"></span>
        <span class="text-xs text-blue-200">实时加入</span>
      </div>
      <div class="space-y-2.5 text-sm" id="liveFeed">
        <div class="flex items-center gap-2.5">
          <span class="w-6 h-6 rounded-full bg-blue-500/30 flex items-center justify-center text-[10px] text-blue-100 font-medium shrink-0">李</span>
          <span class="text-blue-200"><strong class="text-white font-medium">曲靖李家长</strong> 刚刚加入</span>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="w-6 h-6 rounded-full bg-yellow-500/30 flex items-center justify-center text-[10px] text-yellow-100 font-medium shrink-0">王</span>
          <span class="text-blue-200"><strong class="text-white font-medium">大理王家长</strong> 3分钟前加入</span>
        </div>
        <div class="flex items-center gap-2.5">
          <span class="w-6 h-6 rounded-full bg-green-500/30 flex items-center justify-center text-[10px] text-green-100 font-medium shrink-0">张</span>
          <span class="text-blue-200"><strong class="text-white font-medium">昆明张家长</strong> 8分钟前加入</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 底部提示 -->
  <div class="text-center fade-4">
    <p class="text-xs text-blue-300/40">看到的家长帮忙转发给身边的云南高考家长 🙏</p>
  </div>
</div>

</body>
</html>
